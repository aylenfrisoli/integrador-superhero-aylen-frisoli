<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>integrador-superhero-aylen-frisoli</title>
    <link rel="stylesheet" href="/src/app.css" />
  </head>
  <body>
    <div id="app">
      <header class="p-4">
        <h1 class="text-3xl font-bold text-center">Superhero Finder</h1>
      </header>

      <main class="p-4">
        <!-- Acá van a ir la barra de búsqueda y los filtros más adelante -->
        <section id="filters-section" class="mb-4 flex flex-wrap gap-2">
          <!-- Input de búsqueda: filtra los héroes por nombre a medida que se escribe -->
          <input
            type="search"
            id="search-input"
            placeholder="Search heroes by name..."
            aria-label="Search heroes by name"
            class="w-full md:w-80 rounded-lg border border-gray-300 bg-white p-2 shadow focus:outline-none focus:ring-2 focus:ring-blue-400"
          />

          <!-- Filtro por editorial: las opciones se generan con JS según los datos que llegan de la API -->
          <select
            id="filter-publisher"
            aria-label="Filter heroes by publisher"
            class="w-full md:w-56 rounded-lg border border-gray-300 bg-white p-2 shadow focus:outline-none focus:ring-2 focus:ring-blue-400"
          >
            <option value="all">All Publishers</option>
          </select>

          <!-- Filtro por alineación: bueno, malo o neutral -->
          <select
            id="filter-alignment"
            aria-label="Filter heroes by alignment"
            class="w-full md:w-56 rounded-lg border border-gray-300 bg-white p-2 shadow focus:outline-none focus:ring-2 focus:ring-blue-400"
          >
            <option value="all">All Alignments</option>
            <option value="good">good</option>
            <option value="bad">bad</option>
            <option value="neutral">neutral</option>
          </select>
        </section>

        <!-- Texto que muestra cuántos resultados hay en la página actual sobre el total filtrado -->
        <p id="results-summary" class="mb-2 text-sm text-gray-500" aria-live="polite"></p>

        <!-- Acá se pintan las cards de héroes con JavaScript -->
        <section
          id="hero-grid"
          class="grid grid-cols-2 md:grid-cols-4 gap-4"
        ></section>

        <!-- Botones de paginado: First, Previous, Next, Last, dibujados con JavaScript -->
        <section
          id="pagination-controls"
          class="flex flex-wrap items-center justify-center gap-2 mt-4"
        ></section>
      </main>
    </div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
