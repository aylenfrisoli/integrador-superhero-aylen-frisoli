<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>integrador-superhero-aylen-frisoli</title>
    <link rel="stylesheet" href="/src/app.css" />
  </head>
  <body>
    <div id="app">
      <header class="p-4">
        <h1 class="text-2xl md:text-4xl font-bold text-center">Superhero Finder</h1>
      </header>

      <main class="p-4">
        <!-- Acá van a ir la barra de búsqueda y los filtros más adelante -->
        <!-- En mobile los filtros se apilan (flex-col); desde sm (640px) pasan a fila.
             flex-wrap se deja sin prefijo porque incluso a 768px las 3 cajas con ancho fijo
             (320+224+224px) no entran en una sola fila y necesitan pasar a 2 líneas. -->
        <section id="filters-section" class="mb-4 flex flex-col sm:flex-row flex-wrap gap-2">
          <!-- Input de búsqueda: filtra los héroes por nombre a medida que se escribe -->
          <input
            type="search"
            id="search-input"
            placeholder="Search heroes by name..."
            aria-label="Search heroes by name"
            class="w-full sm:w-80 rounded-lg border border-gray-300 bg-white p-2 shadow focus:outline-none focus:ring-2 focus:ring-blue-400"
          />

          <!-- Filtro por editorial: las opciones se generan con JS según los datos que llegan de la API -->
          <select
            id="filter-publisher"
            aria-label="Filter heroes by publisher"
            class="w-full sm:w-56 rounded-lg border border-gray-300 bg-white p-2 shadow focus:outline-none focus:ring-2 focus:ring-blue-400"
          >
            <option value="all">All Publishers</option>
          </select>

          <!-- Filtro por alineación: bueno, malo o neutral -->
          <select
            id="filter-alignment"
            aria-label="Filter heroes by alignment"
            class="w-full sm:w-56 rounded-lg border border-gray-300 bg-white p-2 shadow focus:outline-none focus:ring-2 focus:ring-blue-400"
          >
            <option value="all">All Alignments</option>
            <option value="good">good</option>
            <option value="bad">bad</option>
            <option value="neutral">neutral</option>
          </select>
        </section>

        <!-- Texto que muestra cuántos resultados hay en la página actual sobre el total filtrado -->
        <p id="results-summary" class="mb-2 text-sm text-gray-500" aria-live="polite"></p>

        <!-- Acá se pintan las cards de héroes con JavaScript -->
        <!-- 1 columna en mobile, 2 desde sm (tablet angosto), 4 desde md (tablet ancho/desktop) -->
        <section
          id="hero-grid"
          class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4"
        ></section>

        <!-- Botones de paginado: First, Previous, Next, Last, dibujados con JavaScript -->
        <section
          id="pagination-controls"
          class="flex flex-wrap items-center justify-center gap-2 mt-4"
        ></section>
      </main>

      <!-- Modal con el detalle de cada héroe: se abre al hacer click en una card y se llena con JS -->
      <!-- En mobile el modal ocupa 90% del viewport en vez de max-w-2xl fijo; desde sm (640px)
           vuelve al ancho original. max-h-[90vh] + overflow-y-auto evitan que el contenido
           largo (powerstats) se corte si no entra en la altura de pantalla. -->
      <dialog
        id="hero-modal"
        class="m-auto w-[90vw] sm:w-full sm:max-w-2xl max-h-[90vh] overflow-y-auto rounded-lg border border-gray-300 bg-white p-6 shadow-lg backdrop:bg-black/50"
      >
        <!-- Botón para cerrar el modal, siempre visible arriba a la derecha -->
        <button
          type="button"
          id="close-modal-button"
          aria-label="Close hero details"
          class="absolute top-3 right-3 rounded-full bg-white px-2.5 py-1 text-lg font-bold text-gray-500 shadow hover:bg-gray-100 hover:text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-400"
        >
          &times;
        </button>

        <!-- Acá se inserta el detalle del héroe seleccionado (imagen, estadísticas, etc.) con JS -->
        <div id="modal-content"></div>
      </dialog>
    </div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
